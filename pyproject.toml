[project]
name = "reqassist"
version = "0.1.0"
description = "ReqAssist: LLM-ассистент системного аналитика для валидации и генерации требований"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "ruff>=0.17",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
extend-exclude = [".venv", "notebooks/.ipynb_checkpoints"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "S",   # flake8-bandit
    "RUF", # ruff-specific
]
ignore = [
    "RUF001", # кириллица в строках - ожидаемо для русскоязычного проекта
    "RUF002", # кириллица в docstring
    "RUF003", # кириллица в комментариях
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true
